# CISNE Rondônia — PostgreSQL local (desenvolvimento apenas)
# Credenciais locais — NÃO reutilizar em produção.
# Porta exposta somente em 127.0.0.1 (não público).

services:
  postgres:
    image: postgres:18-alpine
    container_name: cisne_local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cisne_local_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cisne_local_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-cisne_local_dev}
      CISNE_TEST_DB: ${CISNE_TEST_DB:-cisne_local_test}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cisne_local_pg_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  cisne_local_pg_data:
    name: cisne_local_pg_data
