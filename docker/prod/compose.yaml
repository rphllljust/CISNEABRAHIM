# CISNE Rondônia — Produção endurecida (referência)
# DB e object storage em rede interna; somente Caddy expõe 80/443.
# Uso: cp .env.prod.example .env.prod && docker compose -f docker/prod/compose.yaml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:18-alpine
    container_name: cisne_prod_postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: ${PROD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROD_POSTGRES_DB}
    volumes:
      # PG18 PGDATA lives under /var/lib/postgresql/18/docker — the volume must
      # mount /var/lib/postgresql (as dev/HML do) or data is written to the
      # container layer and lost on recreate.
      - cisne_prod_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cisne_prod_internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cisne_prod_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - cisne_prod_object_storage:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [cisne_prod_internal]

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-22T05-26-27Z
    container_name: cisne_prod_minio_bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$OBJECT_STORAGE_BUCKET &&
      mc anonymous set none local/$$OBJECT_STORAGE_BUCKET &&
      mc version enable local/$$OBJECT_STORAGE_BUCKET &&
      mc ilm rule add --expire-days 365 local/$$OBJECT_STORAGE_BUCKET || true
      "
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
    networks: [cisne_prod_internal]

  api:
    build:
      context: ../..
      dockerfile: docker/hml/Dockerfile.api
    container_name: cisne_prod_api
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      # DATABASE_URL / OBJECT_STORAGE_* come solely from .env.prod (env_file):
      # no duplicate overrides that could silently flip sslmode or endpoints.
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [cisne_prod_internal]

  worker:
    build:
      context: ../..
      dockerfile: docker/hml/Dockerfile.api
    container_name: cisne_prod_worker
    restart: unless-stopped
    command: ['node', 'dist/worker/main.js']
    env_file:
      - ../../.env.prod
    environment:
      NODE_ENV: production
      OUTBOX_PUBLISHER_ENABLED: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "dist/worker/main.js" >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cisne_prod_internal]

  web:
    build:
      context: ../..
      dockerfile: docker/hml/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${PROD_PUBLIC_API_URL}
    container_name: cisne_prod_web
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - api
    networks: [cisne_prod_internal]

  caddy:
    image: caddy:2.9-alpine
    container_name: cisne_prod_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cisne_prod_caddy_data:/data
      - cisne_prod_caddy_config:/config
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
      PROD_WEB_DOMAIN: ${PROD_WEB_DOMAIN}
    depends_on:
      - api
      - web
    networks: [cisne_prod_edge, cisne_prod_internal]

networks:
  cisne_prod_internal:
    name: cisne_prod_internal
    internal: true
  cisne_prod_edge:
    name: cisne_prod_edge

volumes:
  cisne_prod_pg_data:
    name: cisne_prod_pg_data
  cisne_prod_object_storage:
    name: cisne_prod_object_storage
  cisne_prod_caddy_data:
    name: cisne_prod_caddy_data
  cisne_prod_caddy_config:
    name: cisne_prod_caddy_config
